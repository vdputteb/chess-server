<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../static/img/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../static/style/base.css" type="text/css" media="all" />
    <script src="../static/js/base.js"></script>
    <title>Chess World</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="../static/img/logo.png" alt="Logo Chess World">
        </div>
        <p id="userPseudo" class="pseudo-style">Invité</p>
        <nav>
            <ul>
                <li>
                    <a href="/solo" class="change-page">
                        <span class="texte-hover">Solo</span>
                    </a>
                </li>
                <li>
                    <a href="/online" class="change-page">
                        <span class="texte-hover">Online</span>
                    </a>
                </li>
                <li>
                    <a href="/param" class="change-page">
                        <img class="settings_btn" src="../static/img/settings.png" alt="Paramètres">
                    </a>
                </li>
                <li>
                    <a href="/login" class="change-page">
                        <div class="id-img">
                            <img src="../static/img/people.jpg" alt="Profil utilisateur">
                        </div>
                    </a>
                </li>
            </ul>
        </nav>
    </header>
    
    <main>
        {% block content %}
        {% endblock %}
    </main>
    
    <footer>
        &copy; 2025 Chess World - Tous droits réservés
    </footer>
</body>
</html>
